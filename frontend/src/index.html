<!doctype html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <title>LA TERCERA | Fotografía Profesional • Deportes & Eventos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/jpeg" href="assets/branding/logo_la_tercera.jpg">

  <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN con configuración del Bento Theme -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#131316',
              pill: '#1A1A1E',
              gold: '#FDB813',
              goldHover: '#F59E0B',
              sky: '#38BDF8',
              canvas: '#ECEEF2'
            },
            surface: {
              canvas: '#ECEEF2',
              card: '#FFFFFF',
              darkCard: '#131316',
              darkPill: '#1A1A1E',
              border: 'rgba(0, 0, 0, 0.05)',
              muted: '#71717A'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          boxShadow: {
            'bento': '0 12px 32px -8px rgba(0, 0, 0, 0.05), 0 4px 12px -2px rgba(0, 0, 0, 0.03)',
            'bento-hover': '0 20px 40px -12px rgba(0, 0, 0, 0.1), 0 6px 16px -4px rgba(0, 0, 0, 0.04)',
            'glass': '0 24px 60px -15px rgba(0, 0, 0, 0.08)'
          }
        }
      }
    }
  </script>
</head>
<body class="text-zinc-900 font-sans antialiased min-h-screen p-2 sm:p-5 md:p-8 relative selection:bg-zinc-900 selection:text-white">
  <app-root></app-root>
</body>
</html>
